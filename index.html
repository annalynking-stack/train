<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#FBFAF7">
<title>Train</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FBFAF7;--ink:#211B20;--aub:#5E3A57;--aub-deep:#4A2C45;--aub-tint:#EFE6EC;
  --forest:#2F5141;--forest-deep:#234032;--forest-tint:#E7EFE9;--muted:#8A8189;
  --line:#ECE6E0;--field:#E6DCE2;--ph:#C8C0C6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',-apple-system,system-ui,sans-serif}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.serif{font-family:'Fraunces',Georgia,serif}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.safe-top{height:env(safe-area-inset-top)}
/* header */
.hd{padding:14px 20px 0}
.hd .row{display:flex;justify-content:space-between;align-items:flex-start}
.hd h1{font-size:27px}
.hd .sub{font-size:13px;color:var(--muted);margin-top:3px}
.iconbtn{font-size:22px;color:var(--muted);line-height:1;padding:6px;margin:-6px}
/* tabs */
.tabs{display:flex;gap:6px;padding:14px 16px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:13px;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;align-items:center;background:none}
.tab.on{background:var(--aub);color:var(--paper)}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--forest);margin-right:5px;display:inline-block}
/* rows */
.row-ex{display:flex;align-items:center;gap:13px;padding:13px 20px;width:100%;text-align:left;border-top:.5px solid var(--line)}
.row-ex:active{background:#F4EFEA}
.thumb{position:relative;width:62px;height:62px;border-radius:10px;flex:none;overflow:hidden;background:var(--aub-tint);display:flex;align-items:center;justify-content:center}
.thumb.f{background:var(--forest-tint)}
.thumb img{width:100%;height:100%;object-fit:cover}
.tri{width:0;height:0;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent var(--aub);margin-left:3px}
.thumb.f .tri{border-left-color:var(--forest)}
.thumb .pl{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(251,250,247,.85);display:flex;align-items:center;justify-content:center}
.thumb .dur{position:absolute;right:4px;bottom:4px;background:rgba(33,27,32,.8);color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}
.mid{flex:1;min-width:0}
.ename{display:block;font-family:'Fraunces',serif;font-size:16px;font-weight:500;margin:0;line-height:1.25}
.emeta{display:block;font-size:12.5px;color:var(--muted);margin:3px 0 0}
.flag{display:inline-block;margin-top:6px;background:var(--forest-tint);color:var(--forest-deep);font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px}
.flag.swap{background:var(--aub-tint);color:var(--aub-deep)}
.chev{color:#C3BBC0;font-size:22px;flex:none;line-height:1}
.done-dot{width:9px;height:9px;border-radius:50%;background:var(--forest);flex:none}
/* detail */
.dh{display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.dh .bk{font-size:26px;color:var(--aub);line-height:1;padding:4px}
.editbtn{display:flex;align-items:center;gap:5px;border:1px solid #D8CFD5;color:var(--aub);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:var(--aub-tint);display:flex;align-items:center;justify-content:center}
.vid.f{background:var(--forest-tint)}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid .playbig{width:56px;height:56px;border-radius:50%;background:rgba(251,250,247,.92);display:flex;align-items:center;justify-content:center;text-decoration:none}
.vid .playbig .tri{border-width:11px 0 11px 18px}
.bd{padding:15px 20px 24px}
.over{font-size:12px;color:var(--muted);font-weight:500}
.dname{font-size:22px;margin:4px 0 0;line-height:1.2}
.dmeta{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sec{font-size:15px;margin:22px 0 10px}
.cue{display:flex;gap:10px;font-size:13.5px;color:#463E45;line-height:1.45;margin:9px 0}
.cdotg{width:6px;height:6px;border-radius:50%;background:var(--forest);flex:none;margin-top:6px}
.lasthint{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.setrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:.5px solid var(--line)}
.setn{font-size:13px;color:var(--muted);width:40px;flex:none}
.fieldw{flex:1;position:relative}
.fieldw input{width:100%;border:1px solid var(--field);border-radius:8px;padding:9px 34px 9px 11px;font-size:15px;background:#fff;color:var(--ink);text-align:left}
.fieldw input:focus{outline:none;border-color:var(--aub);box-shadow:0 0 0 3px rgba(94,58,87,.12)}
.fieldw .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ph);font-size:12px;pointer-events:none}
.chk{width:30px;height:30px;border-radius:8px;border:1.5px solid #D8CFD5;display:flex;align-items:center;justify-content:center;flex:none;color:transparent;font-size:16px;background:#fff}
.chk.on{background:var(--aub);border-color:var(--aub);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:14px;font-size:15px;font-weight:500}
.btn-pri{background:var(--aub);color:var(--paper)}
.btn-out{border:1px solid #D8CFD5;color:var(--aub)}
.btn-forest{background:var(--forest);color:var(--paper)}
.mt{margin-top:14px}
.check-card{border:.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;gap:13px;align-items:flex-start}
.check-card .body{flex:1}
/* home */
.daycard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:.5px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;background:#fff}
.daycard .badge{width:44px;height:44px;border-radius:11px;background:var(--aub-tint);color:var(--aub-deep);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;flex:none}
.daycard .badge.f{background:var(--forest-tint);color:var(--forest-deep)}
.recap{background:#fff;border:.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;border-top:.5px solid var(--line);background:var(--paper);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#A59DA3;font-size:11px;background:none}
.nv svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7}
.nv.on{color:var(--aub)}
/* timer overlay */
.ov{position:fixed;inset:0;z-index:50;background:var(--aub);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px}
.ov.flash{animation:fl .35s steps(1) 0s 6}
@keyframes fl{0%{background:var(--forest)}50%{background:var(--paper)}100%{background:var(--aub)}}
.ov .lab{font-size:14px;opacity:.85;letter-spacing:.04em}
.ov .big{font-family:'Fraunces',serif;font-size:88px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.ov .ctrls{display:flex;gap:12px}
.ov .ob{border:1px solid rgba(251,250,247,.5);border-radius:12px;padding:13px 18px;font-size:15px;font-weight:500;color:var(--paper);min-width:64px}
.ov .ob.solid{background:var(--paper);color:var(--aub);border-color:var(--paper)}
.bar{width:220px;max-width:70vw;height:5px;border-radius:3px;background:rgba(251,250,247,.3);overflow:hidden}
.bar>div{height:100%;background:var(--paper);width:100%}
/* editor + modal */
.ed-ex{border:.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.ed-ex .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.ed-row{display:flex;gap:8px;margin:7px 0}
.ed-row label{font-size:12px;color:var(--muted);width:62px;flex:none;align-self:center}
.ed-row input,.ed-row select,.modal textarea,.modal input{flex:1;border:1px solid var(--field);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:var(--ink)}
.ed-row textarea{flex:1;border:1px solid var(--field);border-radius:8px;padding:8px 10px;font-size:14px;min-height:74px;background:#fff;color:var(--ink)}
.mini{font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:var(--aub);padding:6px 10px;border:1px solid #D8CFD5;border-radius:8px}
.mini.danger{color:#9A3636;border-color:#E3C4C4}
.modal{position:fixed;inset:0;z-index:60;background:rgba(33,27,32,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px;max-height:88vh;overflow:auto}
.sheet h3{font-size:18px;margin-bottom:12px}
.field-block{margin:12px 0}
.field-block label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field-block input,.field-block textarea{width:100%;border:1px solid var(--field);border-radius:8px;padding:10px;font-size:15px;background:#fff;color:var(--ink)}
.field-block textarea{min-height:84px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:.5px solid var(--line)}
.sw{width:46px;height:27px;border-radius:999px;background:#D8CFD5;position:relative;flex:none}
.sw.on{background:var(--aub)}
.sw::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s}
.sw.on::after{left:22px}
.hidetop{height:env(safe-area-inset-top);background:var(--paper)}
</style>
</head>
<body>
<div class="hidetop"></div>
<div id="view"></div>
<nav class="nav" id="nav"></nav>
<div id="overlay"></div>
<div id="modal"></div>

<script>
(function(){
"use strict";

/* ---------------- default programme (the editable content) ---------------- */
var yt = function(q){ return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q + ' exercise form'); };
function ex(o){ o.type = o.type || 'log'; o.cues = o.cues || []; o.video = o.video || yt(o.name); return o; }

var DEFAULT = {
  version: 1,
  days: [
    { id:'s1', name:'Strength 1', short:'Strength 1', focus:'Posterior chain & glutes', accent:'aub', ex:[
      ex({id:'s1b',video:'https://www.youtube.com/watch?v=VPhhE6bBzZE',name:'Bulgarian split squat',sets:3,reps:'8\u201310',rest:75,lead:'left',cat:'forest',cues:['Rear foot on the bench, about two feet in front','Slight forward lean to bias the glute; control the depth','Drive through the front heel; knee tracks over the toes','Loop a TRX handle to hold for balance if the knee feels unsteady']}),
      ex({id:'s1c',video:'https://www.youtube.com/watch?v=bo7BlmKZ47E',name:'Cable reverse lunge',sets:3,reps:'8\u201310 each',rest:75,lead:'left',cat:'aub',cues:['Hold the handle at your chest for counterbalance','Step back into a lunge, front shin vertical, control the depth','Drive through the front heel back to standing; left leg leads']}),
      ex({id:'s1d',video:'https://www.youtube.com/watch?v=L4nTaesNm0E',name:'Single-leg hip thrust',sets:3,reps:'10\u201312 each',rest:60,lead:'left',cat:'forest',cues:['Upper back on the bench, one foot planted, the other leg extended','DB on the working-side hip; drive through the planted heel to a tabletop','Top: ribs down, tailbone tucked \u2014 glutes, not low back','One leg at a time so the DB load is enough; left leg leads']}),
      ex({id:'s1e',video:'https://www.youtube.com/watch?v=Jge8zqHf5Xs',name:'Standing hip abduction',sets:3,reps:'15',rest:45,lead:'left',cat:'aub',cues:['Side-on, cable crossing in front, hold the frame','Lift the leg out straight, toes forward','Glute-med strength protects the knee and drives lateral court movement']}),
      ex({id:'s1h',video:'https://www.youtube.com/watch?v=dBAmQ9bx3JA',name:'Pallof press',sets:3,reps:'10 / side',rest:45,cat:'forest',cues:['Cable at chest height, side-on, step out for tension','Press straight out and resist the twist, hold 2s','Ribs down \u2014 trains the low back to stay braced']}),
      ex({id:'s1f',video:'https://www.youtube.com/watch?v=ZdAHe9_HeEw',name:'Bird dog',type:'check',target:'3 \u00d7 8\u201310 each side',cat:'forest',cues:['On all fours, neutral spine, ribs down','Extend opposite arm and leg; keep hips level \u2014 don\u2019t twist or arch','Slow and controlled \u2014 trains the low back to stay braced']}),
      ex({id:'s1g',video:'https://www.youtube.com/watch?v=H6WptvjXkgw',name:'Standing calf raise',sets:3,reps:'12\u201315',rest:45,cat:'aub',cues:['Balls of feet on a step, heels free','Up tall, 1-second pause at the top','Slow lower to a full stretch \u2014 no bounce']})
    ]},
    { id:'s2', name:'Strength 2', short:'Strength 2', focus:'Upper back, glutes & rotation', accent:'aub', ex:[
      ex({id:'s2a',video:'https://www.youtube.com/watch?v=aKj-6hgiViA',name:'DB step-up',sets:3,reps:'8\u201310 each',rest:60,lead:'left',cat:'aub',cues:['Box or bench at knee height; a DB in each hand','Drive through the top foot to stand tall \u2014 minimal push off the bottom foot','Control the way down; left leg leads']}),
      ex({id:'s2b',video:'https://www.youtube.com/watch?v=qVG1LUzaQoM',name:'Single-arm TRX row',sets:3,reps:'10\u201312 each',rest:60,lead:'left',cat:'forest',cues:['One TRX handle; lean back, body straight, arm extended','Row to the ribs, elbow tight, squeeze the shoulder blade','Walk the feet forward to make it harder','One arm at a time so the left side leads \u2014 spine-safe back builder']}),
      ex({id:'s2c',video:'https://www.youtube.com/watch?v=ljgqer1ZpXg',name:'Face pull',sets:3,reps:'15',rest:45,cat:'forest',cues:['Rope on a high pulley, a hand on each end','Pull to the forehead, elbows high, knuckles back (external rotation)','Upper traps relaxed, rear delts lead \u2014 great posture counter']}),
      ex({id:'s2h',video:'https://www.youtube.com/watch?v=8y2mzYCBvLs',name:'Cable glute kickback',sets:3,reps:'12\u201315 each',rest:45,lead:'left',cat:'aub',cues:['Ankle strap on the low pulley, slight hinge','Kick back and up from the glute; tuck the tailbone at the top','Slow return, keep tension on throughout']}),
      ex({id:'s2d',video:'https://www.youtube.com/watch?v=gcGNypjIQDo',name:'Cable woodchop (high-to-low)',sets:3,reps:'10 / side',rest:60,lead:'left',cat:'forest',cues:['High pulley, both hands by the outside shoulder','Chop down across to the opposite hip \u2014 rotate from the hips, pivot the back foot','Lumbar stays quiet; control it back up']}),
      ex({id:'s2f',video:'https://www.youtube.com/watch?v=VBobkldqqvk',name:'Farmer carry',sets:3,reps:'30\u201340 m',rest:60,cat:'aub',cues:['Heavy DBs, walk tall','Shoulders down, ribs stacked, don\u2019t lean to one side','March on the spot if space is tight']}),
      ex({id:'s2g',name:'Side plank (asymmetric)',type:'check',target:'Left-down 2\u00d720\u201330s \u00b7 Right-down 3\u00d720\u201330s',cat:'forest',cues:['Forearm under the shoulder, body in one line','Don\u2019t let the hips sag','Extra volume right-side-down \u2014 your harder side']})
    ]},
    { id:'pw', name:'Power', short:'Power', focus:'Explosive power & stamina', accent:'aub', ex:[
      ex({id:'pwa',video:'https://www.youtube.com/watch?v=JO7D6GJ98wY',name:'Goblet squat to box',sets:3,reps:'8',rest:75,cat:'aub',cues:['Box behind you set above parallel; DB at the chest','Sit back and down, lightly tap the box, tuck the tailbone at the bottom','Drive up through the heels; braces on']}),
      ex({id:'pwb',video:'https://www.youtube.com/watch?v=73eKch1SMx0',name:'DB lateral lunge',sets:3,reps:'8 each',rest:60,lead:'left',cat:'forest',cues:['Step wide, sit the hips back into that leg, other leg straight','Knee tracks over the toes, control the depth','Slow eccentric, 1-second pause at the bottom \u2014 that\u2019s the brake']}),
      ex({id:'pwc',video:'https://www.youtube.com/watch?v=Or4C-UQ63Xc',name:'Eccentric step-down (deceleration)',sets:3,reps:'6 each',rest:60,lead:'left',cat:'aub',cues:['Stand on a low step (~15\u201320cm), other leg off the edge','Lower over a slow 3-count, hips back, knee soft over the toes','Tap the floor lightly, drive back up \u2014 no bouncing']}),
      ex({id:'pwd',video:'https://www.youtube.com/watch?v=bmbnyoQsL48',name:'DB push press',sets:3,reps:'6',rest:75,cat:'forest',cues:['DBs at the shoulders, small dip from the legs','Drive up and press overhead in one move','Ribs down \u2014 don\u2019t arch the low back']}),
      ex({id:'pwe',video:'https://www.youtube.com/watch?v=gcGNypjIQDo',name:'Cable rotational chop (fast)',type:'check',target:'3 \u00d7 8 / side',cat:'aub',cues:['Same chop as Strength 2, with power intent','Accelerate through the rotation','Hip-driven, lumbar quiet']}),
      ex({id:'pwf',name:'Conditioning intervals',type:'check',target:'6\u20138 \u00d7 30s / 30s',cat:'forest',cues:['Bike if available (no knee impact), else DB complex or shadow footwork','Nose-breathe on the easy 30s','Keep it controlled']})
    ]},
    { id:'ct', name:'Court', short:'Court', focus:'Footwork, drills & mindset', accent:'forest', ex:[
      // --- A. Movement prep (~5 min) ---
      ex({id:'cta1',video:'https://www.youtube.com/watch?v=CbhPRzBZHgQ',name:'Ankle rocks',type:'check',target:'10 each side',cat:'forest',cues:['Half-kneel or stand tall; drive the knee forward over the toes with the heel glued down','Keep it controlled \u2014 you\u2019re waking the joint up, not forcing range','Your calves and ankles set up everything below']}),
      ex({id:'cta2',video:'https://www.youtube.com/watch?v=wnFTIPhNySI',name:'90/90 hip switch',type:'check',target:'8 each side, slow',cat:'forest',cues:['Sit with both legs bent at 90\u00b0; rotate the knees down to switch sides','Move slowly and own the range \u2014 don\u2019t force the end position (you\u2019re hypermobile)','Hands down for support if you need it']}),
      ex({id:'cta3',video:'https://www.youtube.com/watch?v=PWmNVcs8rJY',name:'Standing T-spine rotation',type:'check',target:'8 each side',cat:'forest',cues:['Hands on a wall; rotate through the upper back, not the low back','Keep the hips square and facing forward','This is the rotation that should feed your shots, sparing the lumbar']}),
      // --- B. Footwork: the time-buyer (~12\u201315 min) ---
      ex({id:'ctb1',video:'https://www.youtube.com/watch?v=hpdGd2KdPrk',name:'Split-step timing',type:'check',target:'15\u201320 reps',cat:'forest',cues:['Shadow an opponent: as you imagine their contact, small hop and land soft on the balls of both feet','Knees soft, weight ready \u2014 the instant you \u201csee\u201d direction, push off toward it','The single highest-value drill here \u2014 it\u2019s what stops you feeling late','Vary the direction every rep']}),
      ex({id:'ctb2',video:'https://www.youtube.com/watch?v=iBmvPEWt5og',name:'Lateral shuffle + recover',type:'check',target:'6 lengths',cat:'forest',cues:['Stay low, push off the outside foot, shuffle 3\u20134 steps','Decelerate under control \u2014 no hard cut, you\u2019re protecting the knee','Recover back to your \u201cready\u201d spot \u2014 the reset is the point, not the shuffle']}),
      ex({id:'ctb3',video:'https://www.youtube.com/watch?v=aXNhlhNRZSM',name:'Cross-step to the back glass',type:'check',target:'6 each side',cat:'forest',cues:['Turn sideways and cross-step back as if tracking a lob \u2014 don\u2019t backpedal','Then square up, ready to play the ball','Reading and moving back calmly is where the rush creeps in \u2014 keep it unhurried']}),
      ex({id:'ctb4',video:'https://www.youtube.com/watch?v=-3kmbF30YYE',name:'Agility ladder quick feet (optional)',type:'check',target:'Optional \u00b7 3\u20134 passes',cat:'forest',cues:['In-in-out-out and lateral runs \u2014 fast, flat, low to the ground','No hops \u2014 the knee isn\u2019t cleared for impact yet','Only if you have a ladder; tape or chalk lines work fine']}),
      // --- C. Deceleration & braking (~8\u201310 min) --- shared mechanics baked into each
      ex({id:'ctc1',video:'https://www.youtube.com/watch?v=bIUxKCOwKA0',name:'Linear decel to a stick',type:'check',target:'6 reps \u00b7 50\u201360% speed',cat:'forest',cues:['Build forward 3\u20134 steps, then brake to a full stop over 2\u20133 short, choppy steps','Absorb through the hips \u2014 sit back and down in a mini-hinge, knee soft over the toes','Land in a solid athletic position and hold dead still for 2 seconds','Start at 50\u201360% \u2014 earn speed only once the stop is clean and silent']}),
      ex({id:'ctc2',video:'https://www.youtube.com/watch?v=iBmvPEWt5og',name:'Lateral shuffle to a brake',type:'check',target:'5 each side \u00b7 hold 2s',cat:'forest',cues:['Shuffle 3\u20134 steps, plant the outside foot, sink the hips, brake to a balanced stop','Absorb through the hips, not the knee; widen the base, short choppy steps','Hold 2 seconds \u2014 exactly how you stop to dig out a wide ball and still recover']}),
      ex({id:'ctc3',video:'https://www.youtube.com/watch?v=N4ODVFqUq5c',name:'Decel into split-step',type:'check',target:'8 reps',cat:'forest',cues:['Move toward an imagined ball, brake under control, convert the stop straight into a split-step','The brake buys the time, the split-step turns it into your next move','The calmer the brake, the less the panic','Green light for box jumps = when every stop is silent and rock-steady']}),
      // --- D. Coordination & reaction (~8\u201310 min) ---
      ex({id:'ctd1',video:'https://www.youtube.com/watch?v=LPgv-ZLGDow',name:'Wall rallies / taps',type:'check',target:'Soft, continuous',cat:'forest',cues:['Soft continuous taps against a wall, racket or hand','Track the ball off the rebound \u2014 read the bounce early and let it come to you','Stay relaxed; the goal is reading, not snatching']}),
      ex({id:'ctd2',video:'https://www.youtube.com/watch?v=r36sPP2pYTw',name:'Drop-and-react',type:'check',target:'Eyes track it all the way',cat:'forest',cues:['Drop a ball (or bounce one off the wall) and catch/hit it after one bounce','Eyes tracking it the whole way in','Gradually let it travel later than feels comfortable \u2014 that\u2019s the patience the back glass demands']}),
      ex({id:'ctd3',video:'https://www.youtube.com/watch?v=aIAnOMBCayQ',name:'Two-ball toss-catch / juggling',type:'check',target:'2\u20133 min',cat:'forest',cues:['Two balls, arc from hand to hand at about eye level','Trains hand-eye coordination and staying loose under mild chaos','Drops are part of it \u2014 keep it light']}),
      // --- E. The mental game (~8\u201310 min) --- text-only, no demo video
      ex({id:'cte1',name:'Shadow reset',type:'check',target:'10 reps \u00b7 no ball',cat:'forest',cues:['Turn away toward the back glass','One slow exhale, longer out than in \u2014 the long out-breath is what dials arousal down','Bounce the ball or adjust your strings \u2014 your physical anchor','Say your word: \u201cslow\u201d','Turn, set, ready \u2014 10 clean reps until it runs without you summoning it']}),
      ex({id:'cte2',name:'Breath downshift',type:'check',target:'2 min',cat:'forest',cues:['Sit or stand easy. In through the nose for 4, out for 6\u20138','The longer exhale is the whole point','On the last few breaths, say \u201cslow\u201d on the out-breath \u2014 pairing the word with the calm']}),
      ex({id:'cte3',name:'Eyes to strings',type:'check',target:'1\u20132 min',cat:'forest',cues:['Drop a ball and let it bounce (or feed gently off a wall)','Track it the whole way and call \u201cbounce \u2026 hit\u201d out loud, striking on \u201chit\u201d','A narrow visual focus is one of the fastest ways to quiet a racing mind']}),
      ex({id:'cte4',name:'Let it come',type:'check',target:'2 min',cat:'forest',cues:['Wall rally or shadow swings \u2014 deliberately take the ball late','Let it drop past the top of the bounce before you strike','Say \u201cslow\u201d before every contact \u2014 there\u2019s more time than it feels']}),
      ex({id:'cte5',name:'Pressure flip',type:'check',target:'3\u20134 rounds',cat:'forest',cues:['30 sec of fast feet and quick hits to spike your arousal on purpose','Then freeze and run the full reset (Shadow reset) before you \u201cplay\u201d the next point','Practising the calm right after the scramble is the rep that transfers','Carry it live: run the reset between every point next match, and prep the racket the instant you read direction']})
    ]}
  ]
};

/* ---------------- storage (with in-memory fallback) ---------------- */
var mem = {};
function read(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):(d===undefined?null:d); }catch(e){ return (k in mem)?mem[k]:(d===undefined?null:d); } }
function write(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function getProg(){ var p=read('tk_prog',null); return (p&&p.days)?p:clone(DEFAULT); }
function setProg(p){ write('tk_prog',p); }
function getPrefs(){ return read('tk_prefs',{speak:true,haptic:false}); }
function setPrefs(p){ write('tk_prefs',p); }
function getLast(){ return read('tk_last',{}); }
function setLast(o){ write('tk_last',o); }
function getHist(){ return read('tk_hist',[]); }
function setHist(h){ write('tk_hist',h); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function getSession(){ var s=read('tk_session',null); if(!s||s.date!==todayStr()){ s={date:todayStr(),days:{}}; write('tk_session',s); } return s; }
function saveSession(s){ write('tk_session',s); }
function dayState(dayId){ var s=getSession(); if(!s.days[dayId]) s.days[dayId]={over:{},sets:{},checks:{}}; return {s:s,d:s.days[dayId]}; }

/* effective exercise = base + today override */
function effEx(dayId,e){ var d=dayState(dayId).d; var o=d.over[e.id]; if(!o) return e; var c=clone(e); for(var k in o){ if(o[k]!==undefined&&o[k]!==null&&o[k]!=='') c[k]=o[k]; } c._swapped=!!(o.name&&o.name!==e.name); return c; }

/* ---------------- youtube helpers ---------------- */
function vidId(url){ if(!url) return null; var m=url.match(/[?&]v=([\w-]{11})/)||url.match(/youtu\.be\/([\w-]{11})/)||url.match(/embed\/([\w-]{11})/); return m?m[1]:null; }
function thumb(url){ var id=vidId(url); return id?('https://img.youtube.com/vi/'+id+'/mqdefault.jpg'):null; }

/* ---------------- audio / speech / wakelock ---------------- */
var actx=null;
function primeAudio(){ try{ if(!actx){ var C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} }
document.addEventListener('pointerdown',primeAudio,{once:false});
function beepOnce(t,f){ if(!actx) return; var o=actx.createOscillator(),g=actx.createGain(); o.connect(g); g.connect(actx.destination); o.type='sine'; o.frequency.value=f||880; var n=actx.currentTime+(t||0); g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(0.32,n+0.02); g.gain.exponentialRampToValueAtTime(0.0001,n+0.5); o.start(n); o.stop(n+0.52); }
function alarm(){ primeAudio(); beepOnce(0,880); beepOnce(0.28,880); beepOnce(0.56,1100); }
function speak(t){ try{ var p=getPrefs(); if(p.speak&&'speechSynthesis'in window){ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.rate=1; u.pitch=1; speechSynthesis.speak(u);} }catch(e){} }
function hapticTick(){ try{ var p=getPrefs(); if(p.haptic&&navigator.vibrate) navigator.vibrate(60); }catch(e){} }

var wl=null,wantWake=false;
function lockScreen(){ wantWake=true; try{ if('wakeLock'in navigator){ navigator.wakeLock.request('screen').then(function(s){ wl=s; }).catch(function(){}); } }catch(e){} }
function unlockScreen(){ wantWake=false; try{ if(wl){ wl.release(); wl=null; } }catch(e){} }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&wantWake) lockScreen(); });

/* ---------------- rest timer ---------------- */
var timer={iv:null,left:0,total:0,paused:false};
function startRest(seconds,label){
  primeAudio();
  timer.total=seconds; timer.left=seconds; timer.paused=false; timer.label=label||'Rest';
  renderTimer();
  if(timer.iv) clearInterval(timer.iv);
  timer.iv=setInterval(function(){ if(timer.paused) return; timer.left--; if(timer.left<=0){ clearInterval(timer.iv); timer.iv=null; timerDone(); } renderTimer(); },1000);
}
function timerDone(){
  alarm(); speak('Rest over'); hapticTick();
  var ov=document.getElementById('overlay').firstChild;
  if(ov){ ov.classList.add('flash'); }
  setTimeout(function(){ closeTimer(); },2600);
}
function closeTimer(){ if(timer.iv){ clearInterval(timer.iv); timer.iv=null; } document.getElementById('overlay').innerHTML=''; }
function fmt(s){ s=Math.max(0,s); var m=Math.floor(s/60),x=s%60; return m+':' + (x<10?'0':'') + x; }
function renderTimer(){
  var pct=timer.total?Math.max(0,timer.left/timer.total*100):0;
  document.getElementById('overlay').innerHTML =
    '<div class="ov">'
    + '<div class="lab">'+esc(timer.label)+'</div>'
    + '<div class="big tnum">'+fmt(timer.left)+'</div>'
    + '<div class="bar"><div style="width:'+pct+'%"></div></div>'
    + '<div class="ctrls">'
      + '<button class="ob" data-t="add">+15s</button>'
      + '<button class="ob solid" data-t="pause">'+(timer.paused?'Resume':'Pause')+'</button>'
      + '<button class="ob" data-t="skip">Skip</button>'
    + '</div></div>';
}
document.getElementById('overlay').addEventListener('click',function(e){
  var b=e.target.closest('[data-t]'); if(!b) return;
  var a=b.getAttribute('data-t');
  if(a==='add'){ timer.left+=15; timer.total=Math.max(timer.total,timer.left); renderTimer(); }
  else if(a==='pause'){ timer.paused=!timer.paused; renderTimer(); }
  else if(a==='skip'){ closeTimer(); }
});

/* ---------------- UI state ---------------- */
var ui={view:'home',day:'s1',ex:null};
function findDay(id){ var p=getProg(); for(var i=0;i<p.days.length;i++) if(p.days[i].id===id) return p.days[i]; return p.days[0]; }
function curEx(){ var d=findDay(ui.day); var be=null; for(var i=0;i<d.ex.length;i++) if(d.ex[i].id===ui.ex) be=d.ex[i]; return be?effEx(d.id,be):null; }
function esc(s){ return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------------- views ---------------- */
function render(){
  if(ui.view==='train'||ui.view==='detail') lockScreen(); else unlockScreen();
  if(ui.view==='home') renderHome();
  else if(ui.view==='train') renderTrain();
  else if(ui.view==='detail') renderDetail();
  else if(ui.view==='history') renderHistory();
  else if(ui.view==='more') renderMore();
  renderNav();
}

function renderTrain(){
  var p=getProg(); var d=findDay(ui.day);
  var tabs=p.days.map(function(x){
    return '<button class="tab'+(x.id===ui.day?' on':'')+'" data-day="'+x.id+'">'+(x.accent==='forest'?'<span class="cdot"></span>':'')+esc(x.short||x.name)+'</button>';
  }).join('');
  var st=dayState(d.id).d;
  var rows=d.ex.map(function(be){
    var e=effEx(d.id,be);
    var done=false;
    if(e.type==='check'){ done=!!st.checks[e.id]; }
    else { var arr=st.sets[e.id]||[]; done=arr.length>0 && arr.length>=e.sets && arr.every(function(s){return s&&s.done;}); }
    var th=thumb(e.video);
    var thumbHtml=th?('<img src="'+esc(th)+'" alt="" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'noimg\')">')
                   :('<span class="pl"><span class="tri"></span></span>');
    var meta = e.type==='check' ? esc(e.target||'') : (esc(e.sets+' \u00d7 '+e.reps)+' \u00b7 '+e.rest+'s rest');
    var flags='';
    if(e.lead==='left') flags+='<span class="flag">Left leads</span>';
    if(e._swapped) flags+='<span class="flag swap">Swapped today</span>';
    return '<button class="row-ex" data-ex="'+e.id+'">'
      +'<span class="thumb'+(e.cat==='forest'?' f':'')+'">'+thumbHtml+'</span>'
      +'<span class="mid"><span class="ename">'+esc(e.name)+'</span><span class="emeta">'+meta+'</span>'+(flags?('<span style="display:block;margin-top:5px">'+flags+'</span>'):'')+'</span>'
      +(done?'<span class="done-dot"></span>':'<span class="chev">\u203a</span>')+'</button>';
  }).join('');
  document.getElementById('view').innerHTML=
    '<div class="hd"><div class="row"><div><h1>Train</h1><div class="sub">'+esc(d.focus)+'</div></div>'
      +'<button class="iconbtn" data-nav="more" aria-label="Settings">\u2699</button></div></div>'
    +'<div class="tabs">'+tabs+'</div>'
    +'<div>'+rows+'</div>'
    +'<div style="padding:18px 20px 6px"><button class="btn btn-out" data-finish="'+d.id+'">Finish &amp; save session</button></div>';
}

function renderDetail(){
  var d=findDay(ui.day); var be=null; for(var i=0;i<d.ex.length;i++){ if(d.ex[i].id===ui.ex) be=d.ex[i]; }
  if(!be){ ui.view='train'; return render(); }
  var e=effEx(d.id,be);
  var idx=d.ex.map(function(x){return x.id;}).indexOf(be.id)+1;
  var id=vidId(e.video);
  var vidHtml = id
    ? '<div class="vid'+(e.cat==='forest'?' f':'')+'"><iframe src="https://www.youtube.com/embed/'+id+'" allowfullscreen loading="lazy" title="demo"></iframe></div>'
    : '<a class="vid'+(e.cat==='forest'?' f':'')+'" href="'+esc(e.video)+'" target="_blank" rel="noopener"><span class="playbig"><span class="tri"></span></span></a>';
  var cues=e.cues.map(function(c){ return '<div class="cue"><span class="cdotg"></span><span>'+esc(c)+'</span></div>'; }).join('');
  var meta = e.type==='check' ? esc(e.target||'') : (esc(e.sets+' \u00d7 '+e.reps)+' \u00b7 '+e.rest+'s rest');
  var flag = e.lead==='left' ? '<span class="flag">Left leads</span>' : '';

  var body='';
  if(e.type==='check'){
    var st=dayState(d.id).d; var on=!!st.checks[e.id];
    body='<div class="sec">Run the drill</div>'+cues
      +'<button class="btn '+(on?'btn-forest':'btn-out')+' mt" data-check="'+e.id+'">'+(on?'\u2713 Done today':'Mark done')+'</button>';
  } else {
    var st2=dayState(d.id).d; var arr=st2.sets[e.id]||[]; var lastArr=getLast()[e.id];
    var hint = lastArr&&lastArr.length ? ('Last time \u00b7 '+lastArr.map(function(s){return s.w+'kg \u00d7 '+s.r;}).join(', ')) : 'No history yet \u2014 log your first set';
    var setRows='';
    for(var s=0;s<e.sets;s++){

        +'<span class="fieldw"><input inputmode="decimal" data-set="'+s+'" data-f="w" value="'+(rec.w!=null?esc(rec.w):'')+'" placeholder="\u2014"><span class="u">kg</span></span>'
        +'<span class="fieldw"><input inputmode="numeric" data-set="'+s+'" data-f="r" value="'+(rec.r!=null?esc(rec.r):'')+'" placeholder="\u2014"><span class="u">reps</span></span>'
        +'<button class="chk'+(on2?' on':'')+'" data-doneset="'+s+'" aria-label="Mark set done">\u2713</button></div>';
    }
    body='<div class="sec">Cues</div>'+cues
      +'<div class="sec" style="display:flex;justify-content:space-between;align-items:center">Log your sets <button class="mini" data-allsets="1">Tick all</button></div><p class="lasthint">'+esc(hint)+'</p>'+setRows
      +'<button class="btn btn-pri mt" data-rest="'+e.rest+'"><span style="font-size:17px">\u23f1</span> Start '+e.rest+'s rest</button>';
  }

  document.getElementById('view').innerHTML=
    '<div class="dh"><button class="bk" data-back="1" aria-label="Back">\u2039</button>'
      +'<button class="editbtn" data-edit="'+e.id+'">\u270e Edit</button></div>'
    +vidHtml
    +'<div class="bd"><p class="over">'+esc(d.name)+' \u00b7 exercise '+idx+' of '+d.ex.length+'</p>'
      +'<h1 class="dname">'+esc(e.name)+'</h1><div class="dmeta"><span>'+meta+'</span>'+flag+'</div>'
      +body+'</div>';

  document.getElementById('view').innerHTML=
    '<div class="dh"><button class="bk" data-go="more" aria-label="Back">\u2039</button><strong>Edit programme</strong><span style="width:30px"></span></div>'
    +'<div style="padding:6px 20px 0"><p class="muted" style="font-size:12.5px">Changes here are permanent. On-the-spot swaps during a session stay today-only.</p>'+days+'</div>';
}

/* ---------------- edit-for-today sheet ---------------- */
function openEditSheet(eid){
  var d=findDay(ui.day); var be=null; for(var i=0;i<d.ex.length;i++) if(d.ex[i].id===eid) be=d.ex[i];
  if(!be) return;
  var e=effEx(d.id,be);
  var logFields = e.type==='check' ? '' :
      '<div class="field-block"><label>Sets</label><input id="es-sets" inputmode="numeric" value="'+esc(e.sets)+'"></div>'
     +'<div class="field-block"><label>Reps</label><input id="es-reps" value="'+esc(e.reps)+'"></div>'
     +'<div class="field-block"><label>Rest (seconds)</label><input id="es-rest" inputmode="numeric" value="'+esc(e.rest)+'"></div>';
  document.getElementById('modal').innerHTML=
    '<div class="modal"><div class="sheet"><h3>Edit for today</h3>'
    +'<p class="muted" style="font-size:12.5px;margin-top:-6px">Rename or swap this exercise just for today. Your saved programme stays the same.</p>'
    +'<div class="field-block"><label>Exercise name</label><input id="es-name" value="'+esc(e.name)+'"></div>'
    +logFields
    +'<button class="btn btn-pri mt" id="es-save">Save for today</button>'
    +'<button class="btn btn-out mt" id="es-reset">Reset to original</button>'
    +'<button class="btn btn-out mt" id="es-cancel">Cancel</button>'
    +'</div></div>';
  document.getElementById('es-cancel').onclick=closeModal;
  document.getElementById('es-reset').onclick=function(){ var ds=dayState(d.id); delete ds.d.over[eid]; saveSession(ds.s); closeModal(); render(); };
  document.getElementById('es-save').onclick=function(){
    var ds=dayState(d.id); var o=ds.d.over[eid]||{};
    o.name=document.getElementById('es-name').value.trim()||e.name;
    if(e.type!=='check'){
      o.sets=parseInt(document.getElementById('es-sets').value,10)||e.sets;
      o.reps=document.getElementById('es-reps').value.trim()||e.reps;
      o.rest=parseInt(document.getElementById('es-rest').value,10)||e.rest;
    }
    ds.d.over[eid]=o; saveSession(ds.s); closeModal(); render();
  };
}
function closeModal(){ document.getElementById('modal').innerHTML=''; }

/* ---------------- import / export / reset sheets ---------------- */
function openExport(){
  var json=JSON.stringify(getProg(),null,2);
  document.getElementById('modal').innerHTML='<div class="modal"><div class="sheet"><h3>Export / back up</h3>'
    +'<p class="muted" style="font-size:12.5px;margin-top:-6px">Copy this somewhere safe, or download it. This is your backup and how a new programme gets shared.</p>'
    +'<textarea id="ex-json" style="width:100%;min-height:200px;border:1px solid var(--field);border-radius:8px;padding:10px;font-size:12px;font-family:ui-monospace,monospace">'+esc(json)+'</textarea>'
    +'<button class="btn btn-pri mt" id="ex-copy">Copy to clipboard</button>'
    +'<button class="btn btn-out mt" id="ex-dl">Download file</button>'
    +'<button class="btn btn-out mt" id="ex-close">Close</button></div></div>';
  document.getElementById('ex-close').onclick=closeModal;
  document.getElementById('ex-copy').onclick=function(){ var t=document.getElementById('ex-json'); t.select(); try{document.execCommand('copy');}catch(e){} try{navigator.clipboard.writeText(t.value);}catch(e){} this.textContent='Copied \u2713'; };
  document.getElementById('ex-dl').onclick=function(){ var b=new Blob([json],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='programme.json'; a.click(); };
}
function openImport(){
  document.getElementById('modal').innerHTML='<div class="modal"><div class="sheet"><h3>Import programme</h3>'
    +'<p class="muted" style="font-size:12.5px;margin-top:-6px">Paste the JSON for a new programme. This replaces your current one (your logs and history stay).</p>'
    +'<textarea id="im-json" placeholder="Paste JSON here" style="width:100%;min-height:200px;border:1px solid var(--field);border-radius:8px;padding:10px;font-size:12px;font-family:ui-monospace,monospace"></textarea>'
    +'<div id="im-err" style="color:#9A3636;font-size:13px;margin-top:6px"></div>'
    +'<button class="btn btn-pri mt" id="im-apply">Replace programme</button>'
    +'<button class="btn btn-out mt" id="im-close">Cancel</button></div></div>';
  document.getElementById('im-close').onclick=closeModal;
  document.getElementById('im-apply').onclick=function(){
    try{ var p=JSON.parse(document.getElementById('im-json').value); if(!p||!p.days||!p.days.length) throw 0; setProg(p); closeModal(); ui.view='train'; ui.day=p.days[0].id; render(); }
    catch(e){ document.getElementById('im-err').textContent='That doesn\u2019t look like valid programme JSON.'; }
  };
}
function confirmReset(){
  document.getElementById('modal').innerHTML='<div class="modal"><div class="sheet"><h3>Reset programme?</h3>'
    +'<p class="muted" style="font-size:13px">This restores the original exercises. Your history and logged numbers are kept.</p>'
    +'<button class="btn btn-pri mt" id="rs-yes" style="background:#9A3636">Yes, reset</button>'
    +'<button class="btn btn-out mt" id="rs-no">Cancel</button></div></div>';
  document.getElementById('rs-no').onclick=closeModal;
  document.getElementById('rs-yes').onclick=function(){ setProg(clone(DEFAULT)); closeModal(); ui.view='train'; ui.day='s1'; render(); };
}

/* ---------------- finish session -> history ---------------- */
function finishDay(dayId){
  var d=findDay(dayId); var ds=dayState(dayId); var last=getLast(); var entries=[]; var count=0;
  d.ex.forEach(function(be){
    var e=effEx(dayId,be);
    if(e.type==='check'){ if(ds.d.checks[e.id]){ entries.push({name:e.name,note:'done'}); count++; } }
    else {
      var marked=(ds.d.sets[e.id]||[]);
      var arr=marked.filter(function(s){return s&&(s.w!=null||s.r!=null);}).map(function(s){return {w:s.w||0,r:s.r||0};});
      if(arr.length){ entries.push({name:e.name,sets:arr}); last[e.id]=arr; count++; }
      else if(marked.some(function(s){return s&&s.done;})){ entries.push({name:e.name,note:'done'}); count++; }
    }
  });
  if(!count){ alert('Nothing logged yet for this session.'); return; }
  var h=getHist(); h.unshift({date:todayStr(),day:d.name,count:count,entries:entries}); if(h.length>120) h.length=120; setHist(h); setLast(last);
  delete ds.s.days[dayId]; saveSession(ds.s);
  ui.view='history'; render();
}

/* ---------------- events ---------------- */
document.getElementById('nav').addEventListener('click',function(e){ var b=e.target.closest('[data-nav]'); if(b){ ui.view=b.getAttribute('data-nav'); render(); } });

document.getElementById('view').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-nav]'))){ ui.view=t.getAttribute('data-nav'); return render(); }
  if((t=e.target.closest('[data-open]'))){ ui.view='train'; ui.day=t.getAttribute('data-open'); return render(); }
  if((t=e.target.closest('[data-day]'))){ ui.day=t.getAttribute('data-day'); return render(); }
  if((t=e.target.closest('[data-ex]'))){ ui.ex=t.getAttribute('data-ex'); ui.view='detail'; return render(); }
  if((t=e.target.closest('[data-back]'))){ ui.view='train'; return render(); }
  if((t=e.target.closest('[data-rest]'))){ return startRest(parseInt(t.getAttribute('data-rest'),10),'Rest'); }
  if((t=e.target.closest('[data-edit]'))){ return openEditSheet(t.getAttribute('data-edit')); }
  if((t=e.target.closest('[data-finish]'))){ return finishDay(t.getAttribute('data-finish')); }
  if((t=e.target.closest('[data-check]'))){
    var d=findDay(ui.day); var ds=dayState(d.id); var id=t.getAttribute('data-check');
    ds.d.checks[id]=!ds.d.checks[id]; saveSession(ds.s); return render();
  }
  if((t=e.target.closest('[data-allsets]'))){
    var ce=curEx(); if(!ce||ce.type==='check') return; var n=ce.sets||0;
    var dsa=dayState(findDay(ui.day).id); var aa=dsa.d.sets[ui.ex]||[]; while(aa.length<n) aa.push({});
    var allD=true; for(var z=0;z<n;z++){ if(!(aa[z]&&aa[z].done)){ allD=false; break; } }
    for(var z2=0;z2<n;z2++){ aa[z2]=aa[z2]||{}; aa[z2].done=!allD; }
    dsa.d.sets[ui.ex]=aa; saveSession(dsa.s); renderDetail(); return;
  }
  if((t=e.target.closest('[data-doneset]'))){
    var dd=findDay(ui.day); var dss=dayState(dd.id); var si=+t.getAttribute('data-doneset');
    var arr=dss.d.sets[ui.ex]||[]; while(arr.length<=si) arr.push({}); arr[si].done=!arr[si].done;
    dss.d.sets[ui.ex]=arr; saveSession(dss.s); renderDetail(); return;
  }
  if((t=e.target.closest('[data-toggle]'))){ var pr=getPrefs(); var k=t.getAttribute('data-toggle'); pr[k]=!pr[k]; setPrefs(pr); return render(); }
  if((t=e.target.closest('[data-go]'))){
    var g=t.getAttribute('data-go');
    if(g==='more'){ ui.view='more'; return render(); }
    if(g==='editor'){ return renderEditor(); }
    if(g==='export'){ return openExport(); }
    if(g==='import'){ return openImport(); }
    if(g==='reset'){ return confirmReset(); }
  }
  /* editor controls */
  if((t=e.target.closest('[data-add]'))){ var p=getProg(); var day=p.days.filter(function(x){return x.id===t.getAttribute('data-add');})[0]; day.ex.push({id:'x'+Date.now(),name:'New exercise',type:'log',sets:3,reps:'10',rest:60,cues:[],video:''}); setProg(p); return renderEditor(); }
  if((t=e.target.closest('[data-del]'))){ var p2=getProg(); var dy=p2.days.filter(function(x){return x.id===t.getAttribute('data-d');})[0]; dy.ex=dy.ex.filter(function(x){return x.id!==t.getAttribute('data-del');}); setProg(p2); return renderEditor(); }
  if((t=e.target.closest('[data-mv]'))){
    var p3=getProg(); var dy2=p3.days.filter(function(x){return x.id===t.getAttribute('data-d');})[0];
    var ids=dy2.ex.map(function(x){return x.id;}); var i=ids.indexOf(t.getAttribute('data-e')); var j=t.getAttribute('data-mv')==='up'?i-1:i+1;
    if(j>=0&&j<dy2.ex.length){ var tmp=dy2.ex[i]; dy2.ex[i]=dy2.ex[j]; dy2.ex[j]=tmp; setProg(p3); }
    return renderEditor();
  }
});

/* live inputs: set logging + editor fields */
document.getElementById('view').addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-set')){
    var dd=findDay(ui.day); var dss=dayState(dd.id); var si=+t.getAttribute('data-set'); var f=t.getAttribute('data-f');
    var arr=dss.d.sets[ui.ex]||[]; while(arr.length<=si) arr.push({});
    var val=t.value.trim(); arr[si][f]= val===''?null:(f==='w'?parseFloat(val):parseInt(val,10));
    dss.d.sets[ui.ex]=arr; saveSession(dss.s); return;
  }
  if(t.hasAttribute('data-ef')){
    var p=getProg(); var day=p.days.filter(function(x){return x.id===t.getAttribute('data-d');})[0];
    var ee=day.ex.filter(function(x){return x.id===t.getAttribute('data-e');})[0]; var f2=t.getAttribute('data-ef');
    if(f2==='cues') ee.cues=t.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    else if(f2==='sets'||f2==='rest') ee[f2]=parseInt(t.value,10)||0;
    else if(f2==='lead') ee.lead=t.value||null;
    else if(f2==='type') { ee.type=t.value; setProg(p); return renderEditor(); }
    else ee[f2]=t.value;
    setProg(p);
  }
});

render();
})();
